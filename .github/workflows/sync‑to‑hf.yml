name: Sync GitHub to HuggingFace Space
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 同步到 Hugging Face
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git remote add hf https://penggan00:${{ secrets.HF_TOKEN }}@huggingface.co/spaces/penggan0/pg
          git push -f hf main

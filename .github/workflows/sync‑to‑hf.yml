name: Sync GitHub to HuggingFace Space
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 推送到 Hugging Face（详细输出）
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git remote add hf https://penggan00:${{ secrets.HF_TOKEN }}@huggingface.co/spaces/penggan0/pg
          echo "=== 开始推送 ==="
          git push -f hf main 2>&1
          echo "=== 推送完成 ==="
        continue-on-error: true  # 即使失败也继续显示日志

      - name: 显示推送结果
        if: always()
        run: |
          echo "=== Git 状态 ==="
          git status
          echo "=== 远程地址 ==="
          git remote -v
